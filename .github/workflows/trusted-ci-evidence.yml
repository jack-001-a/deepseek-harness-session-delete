name: trusted-ci-evidence

# Only canonical-repository main-branch executions may mint provenance.
# The called reusable workflow is the cryptographic Build Signer identity;
# this file remains the top-level Build Config identity.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-ci-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-attest:
    if: github.repository == 'jack-001-a/deepseek-harness-session-delete' && github.ref == 'refs/heads/main' && github.ref_protected == true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/trusted-ci-evidence-reusable.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
