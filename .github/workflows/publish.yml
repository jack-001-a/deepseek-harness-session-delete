name: publish

# Publishes through npm Trusted Publishing (OIDC): no long-lived token, no
# one-time password. The trusted publisher is bound to this exact workflow
# filename and repository, so neither may be renamed without reconfiguring it.
on:
  push:
    tags:
      - 'v*':

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    # Run the same complete platform/runtime matrix as ci.yml before any release action.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run the test suite
        run: npm test

      - name: Verify the package manifest
        run: |
          node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); if (!p.engines?.node) throw new Error('engines.node is required'); console.log(p.name, p.version)"

      - name: Inspect the tarball contents
        run: npm pack --dry-run

  publish:
    needs: validate
    # Release tags must point to a commit reachable from main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Required for the OIDC identity GitHub exchanges with npm.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing requires npm CLI >= 11.5.1 and Node >= 22.14.
      # Pin the CLI to make the OIDC publishing environment reproducible.
      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@11.21.2

      - name: Verify the package manifest and release tag
        run: |
          node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); if (!p.engines?.node) throw new Error('engines.node is required'); console.log(p.name, p.version)"
          version="$(node -p "require('./package.json').version")"
          if ! grep -Fq "## [$version] —" CHANGELOG.md; then
            echo "CHANGELOG.md has no release section for $version" >&2
            exit 1
          fi
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error('npm Trusted Publishing requires Node.js >= 22.14.0')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "Release tags must point to a commit reachable from main" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME#v}"
            version="$(node -p "require('./package.json').version")"
            if [[ "$tag" != "$version" ]]; then
              echo "Release tag v$tag does not match package version $version" >&2
              exit 1
            fi
          fi
          node --version
          npm --version

      # A main-branch version bump or a pushed release tag produces both the
      # GitHub Release and its exact changelog notes. Existing releases are
      # idempotently left untouched, so ordinary main pushes are safe.
      - name: Create GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; nothing to create"
            exit 0
          fi
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 == "## [" version "] — " substr($0, length("## [" version "] — ") + 1) { in_release=1; next }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "No release notes found for $version in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Session Delete $version" \
            --notes-file "$notes_file"

      # A release is often published twice on purpose: once from a workstation
      # that already holds the registry token, and once from the tag that
      # records it. npm refuses to publish a version that exists, so the
      # second attempt must skip rather than fail the release.
      - name: Check whether the version is already published
        id: published
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          set +e
          output="$(npm view "${package}@${version}" version 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${package}@${version} is already on the registry; nothing to publish"
          elif grep -q 'E404' <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${package}@${version} is not on the registry yet"
          else
            echo "$output" >&2
            exit "$status"
          fi

      # Newly configured npm trusted publishers may allow staged publishing
      # only. The maintainer approves the staged version with 2FA before it
      # becomes publicly installable.
      - name: Stage package through npm Trusted Publishing (OIDC)
        id: oidc_stage
        if: steps.published.outputs.exists == 'false'
        continue-on-error: true
        run: |
          set +e
          output="$(npm stage publish 2>&1)"
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [[ $status -eq 0 ]]; then
            echo "result=staged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eqi 'previously staged version|E409|409 Conflict' <<< "$output"; then
            echo "The exact package version is already staged; maintainer approval is still required."
            echo "result=already-staged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      # Optional fallback for repositories that use a granular npm token.
      - name: Stage package with repository NPM_TOKEN fallback
        id: token_stage
        if: steps.published.outputs.exists == 'false' && steps.oidc_stage.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "npm staged publishing was denied and the NPM_TOKEN repository secret is not configured." >&2
            echo "Configure npm Trusted Publishing for this exact repository and publish.yml workflow, or add a granular NPM_TOKEN secret." >&2
            exit 1
          fi
          npm stage publish

      - name: Report staged npm release
        if: steps.oidc_stage.outcome == 'success' || steps.token_stage.outcome == 'success'
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          {
            echo "### npm staged release"
            echo
            echo "- Package: \\`$package\\`"
            echo "- Version: \\`$version\\`"
            echo "- Status: submitted to npm Staged Publishing; it is not publicly installable until approved."
            echo "- Required action: review the staged package in npmjs.com and approve it with 2FA."
          } >> "$GITHUB_STEP_SUMMARY"

