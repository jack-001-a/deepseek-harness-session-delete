name: publish

# Publishing does not have to happen on your machine. Push a version tag (or
# run this manually) and GitHub's runner publishes to npm.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify the package manifest
        run: node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); console.log(p.name, p.version)"

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
