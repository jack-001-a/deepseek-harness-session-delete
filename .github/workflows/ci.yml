name: ci

# Runs the test suite on every push and pull request, on the platforms the
# plugin claims to support. The publish workflow stays separate: it only runs
# for a release tag and only after this workflow is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run the test suite
        run: npm test

      - name: Verify the package manifest
        run: |
          node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); console.log(p.name, p.version)"

      - name: Inspect the tarball contents
        run: npm pack --dry-run
