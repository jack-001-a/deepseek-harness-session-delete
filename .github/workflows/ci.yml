name: ci

# Runs the test suite on every push and pull request, on the platforms the
# plugin claims to support. The publish workflow stays separate: it only runs
# for a release tag and only after this workflow is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep main-branch runs alive: the pinned Harness builds and two-process
# integration jobs are intentionally expensive and should finish with evidence.
# Pull-request runs may be superseded by newer commits to the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run the test suite
        run: npm test

      - name: Verify the package manifest
        run: |
          node -e "const p=require('./package.json'); if (p.private) throw new Error('package.json must not be private'); if (!p.repository?.url) throw new Error('repository.url is required for trusted publishing'); if (!p.engines?.node) throw new Error('engines.node is required'); if (!p.engines?.dsh) throw new Error('engines.dsh is required'); console.log(p.name, p.version)"

      - name: Verify the published npm archive
        shell: bash
        run: |
          npm pack --dry-run --json > npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8'));
          if (!Array.isArray(report) || !Array.isArray(report[0]?.files)) {
            throw new Error('npm pack did not return a valid file manifest');
          }
          const paths = new Set(report[0].files.map((file) => file.path));
          const required = [
            'index.js',
            'client.js',
            'cordis.patch.yml',
            'locale/en.json',
            'locale/zh.json',
            'icon.svg',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'CONTRIBUTING.md',
            'SECURITY.md',
            'docs/architecture.md',
            'docs/attachment-lifecycle.md',
            'docs/attachment-reference-conformance.md',
            'docs/attachment-gc-rfc.md',
            'docs/host-attachment-reference-api-proposal.md',
          ];
          const missing = required.filter((path) => !paths.has(path));
          if (missing.length) {
            throw new Error('npm archive is missing required runtime or documentation files: ' + missing.join(', '));
          }
          const unexpected = [...paths].filter((path) =>
            path.startsWith('.github/') || path.startsWith('test/') || path.startsWith('scripts/'),
          );
          if (unexpected.length) {
            throw new Error('npm archive contains development-only files: ' + unexpected.join(', '));
          }
          console.log('npm archive content check passed (' + paths.size + ' files)');
          NODE

  dialog-browser-visual:
    name: Chromium delete-dialog visual contract
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the pinned browser-test runtime
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify the Host Modal visual contract
        run: npm run test:browser

      - name: Upload browser screenshots
        if: always() && hashFiles('artifacts/session-delete-dialog-*.png') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-delete-dialog-chromium
          path: artifacts/session-delete-dialog-*.png
          if-no-files-found: error
          retention-days: 30

  harness-session-delete-e2e:
    name: Harness ${{ matrix.harness.version }} / Linux / Node 24 / Persistence and Web UI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness:
          - version: "0.2.2-rc.4"
            ref: "3f321d32bfe382212a8ed8785c1d47a5a300aa23"
          - version: "0.2.2-rc.5"
            ref: "9c2670d3bce5275e0d1610272958121af87787bb"
          - version: "0.2.3-alpha.2"
            ref: "4b399c39a6d1479cd84ca591b4d7c88e24d38a96"
    steps:
      - name: Check out Session Delete
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned DeepSeek Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.harness.ref }}
          path: deepseek-harness
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.5
          package_json_file: deepseek-harness/package.json

      - name: Install the upstream workspace dependency graph
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build the upstream native system addon
        if: matrix.harness.version != '0.2.3-alpha.2'
        working-directory: deepseek-harness
        run: pnpm run build:native-system

      - name: Build the upstream Host libraries
        if: matrix.harness.version != '0.2.3-alpha.2'
        working-directory: deepseek-harness
        run: pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries

      - name: Build the official Host, Client and Web artifact graph
        if: matrix.harness.version == '0.2.3-alpha.2'
        working-directory: deepseek-harness
        run: pnpm run build:artifacts

      - name: Exercise session leases with two real Harness processes
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HARNESS_VERSION: ${{ matrix.harness.version }}
          DSH_E2E_MANIFEST: ${{ github.workspace }}/artifacts/session-delete-harness-e2e.json
        run: node scripts/run-harness-session-delete-e2e.mjs

      - name: Install Chromium for the real Harness Web UI
        if: matrix.harness.version == '0.2.3-alpha.2'
        working-directory: deepseek-harness
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Exercise Session Delete in the real Harness Web UI
        if: matrix.harness.version == '0.2.3-alpha.2'
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
        run: node scripts/run-harness-session-delete-ui-e2e.mjs

      - name: Upload real Harness Web UI failure screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-delete-real-harness-web-ui
          path: deepseek-harness/.artifacts/session-delete-real-ui.png
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

      - name: Upload two-process compatibility evidence
        if: always() && hashFiles('artifacts/session-delete-harness-e2e.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-delete-harness-e2e-${{ matrix.harness.version }}
          path: artifacts/session-delete-harness-e2e.json
          if-no-files-found: error
          retention-days: 30
